worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_authorization $media_header_token { default ""; "~^Bearer (?<media_bearer>.+)$" $media_bearer; }
  map $arg_access_token $requested_media_token { "" $media_header_token; default $arg_access_token; }
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    set $backend_url http://backend:8080;
    set $media_url http://livekit:7880;
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self), geolocation=()" always;
    location = /api/media/authorize { return 404; }
    location = /_media_auth {
      internal;
      proxy_pass $backend_url/api/media/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Media-Token $media_token;
    }
    location /media/rtc {
      error_log /dev/null;
      set $media_token $requested_media_token;
      auth_request /_media_auth;
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass $media_url$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
    location /media { return 404; }
    location /twirp { return 404; }
    location /api/ {
      proxy_pass $backend_url$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header Cache-Control no-store always;
    }
    location = /health { proxy_pass $backend_url/actuator/health; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
