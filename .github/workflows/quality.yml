name: MeetDesk quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Backend formatter, all tests and package
        working-directory: backend
        run: mvn -B spotless:check test package
      - name: Frontend formatter, lint, tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Public artifact and configuration checks
        run: |
          python3 scripts/test-config.py
          python3 scripts/release-check.py
          git diff --check
          python3 scripts/init-env.py
          docker compose -p meetdesk-ci config --quiet
      - name: Fresh MySQL deployment and real HTTP acceptance
        run: |
          docker compose -p meetdesk-ci up -d --build --wait --wait-timeout 240
          python3 -m venv .venv-quality
          .venv-quality/bin/pip install -r scripts/requirements-quality.txt
          .venv-quality/bin/python scripts/quality.py
          .venv-quality/bin/python scripts/verify-media.py
      - name: Clean only this disposable instance
        if: always()
        run: docker compose -p meetdesk-ci down -v
